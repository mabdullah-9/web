
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Start Pause Stop Control</title>
</head>

<body>

<div style="text-align:center; margin-top:40px;">

    <!-- START BUTTON -->
    <button type="button" onclick="startTimer()" style="
        background: linear-gradient(135deg, #22c55e, #0369a1);
        color: white;
        padding: 13px 30px;
        border: 1px solid #38bdf8;
        border-radius: 10px;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1.5px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(2,132,199,0.5);
        margin: 8px;
    ">START</button>

    <!-- PAUSE BUTTON -->
    <button type="button" onclick="pauseTimer()" style="
        background: linear-gradient(135deg, #facc15, #ea580c);
        color: white;
        padding: 13px 30px;
        border: 1px solid #fbbf24;
        border-radius: 10px;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1.5px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(234,88,12,0.5);
        margin: 8px;
    ">PAUSE</button>

    <!-- STOP BUTTON -->
    <button type="button" onclick="stopTimer()" style="
        background: linear-gradient(135deg, #ef4444, #991b1b);
        color: white;
        padding: 13px 30px;
        border: 1px solid #f87171;
        border-radius: 10px;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1.5px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(239,68,68,0.5);
        margin: 8px;
    ">STOP</button>

    <h2 id="timer">00:00</h2>
    <h3 id="status">Status: Stopped</h3>

</div>

<script>

let seconds = 0;
let timer = null;

function updateDisplay() {
    let minutes = Math.floor(seconds / 60);
    let remainingSeconds = seconds % 60;

    document.getElementById("timer").innerHTML =
        String(minutes).padStart(2, "0") + ":" +
        String(remainingSeconds).padStart(2, "0");
}

function startTimer() {

    if (timer !== null) return;

    document.getElementById("status").innerHTML =
        "Status: Running";

    timer = setInterval(function() {
        seconds++;
        updateDisplay();
    }, 250);
}

function pauseTimer() {

    if (timer !== null) {
        clearInterval(timer);
        timer = null;

        document.getElementById("status").innerHTML =
            "Status: Paused";
    } 
    else {
        startTimer();
    }
}

function stopTimer() {

    clearInterval(timer);
    timer = null;

    seconds = 0;
    updateDisplay();

    document.getElementById("status").innerHTML =
        "Status: Stopped";
}

</script>

</body>
</html>
